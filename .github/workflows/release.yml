name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout into a subdirectory so the workspace forms a valid
      # one-package OpenWrt feed for the SDK action.
      # Actions are pinned by commit SHA: tags are mutable and can be
      # repointed at other code by a compromised upstream account.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: luci-app-routelists

      - name: Build ipk with OpenWrt SDK
        uses: openwrt/gh-action-sdk@7fc2640243284ecc44f4a9c3f749a61746ee02cb # v11
        env:
          ARCH: x86_64-24.10.0
          # the ru i18n package is generated by luci.mk from the same
          # Makefile and has no own directory — do not list it here
          PACKAGES: luci-app-routelists
          NO_REFRESH_CHECK: true

      - name: List built packages
        run: find bin -name '*routelists*'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            bin/packages/*/*/luci-app-routelists*.ipk
            bin/packages/*/*/luci-i18n-routelists-ru*.ipk
          generate_release_notes: true
