name: CI

on:
  # only main, otherwise every same-repo PR runs twice (push + pull_request)
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned by commit SHA: tags are mutable and can be
      # repointed at other code by a compromised upstream account
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install eslint
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Grammar tests
        run: npm test
