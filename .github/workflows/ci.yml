name: CI

on:
  # only main, otherwise every same-repo PR runs twice (push + pull_request)
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned by commit SHA: tags are mutable and can be
      # repointed at other code by a compromised upstream account
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install eslint
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Grammar tests
        run: npm test
