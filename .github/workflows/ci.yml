name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install eslint
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Grammar tests
        run: npm test
